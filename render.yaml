# Render Blueprint — Warli Speech Translator (ONE service: API + frontend).
# Deploy: Render dashboard -> "New +" -> "Blueprint" -> point at this repo.
# Render reads this file, builds the root Dockerfile, and applies the settings.
#
# SINGLE SERVER: the Docker image builds the React app and runs FastAPI, which
# serves the JSON API under /api AND the built UI at / — one origin, no separate
# frontend host, no CORS hop. (The frontend used to be split onto Vercel; it no
# longer is.) The service name stays `warli-backend` so the existing
# https://warli-backend.onrender.com URL now serves the whole app.
#
# NOTE ON DATA: the whole repo is the Docker build context, so the Dockerfile
# copies the sibling data/ folder into the image. config.py resolves all paths
# from its own file location, which stays correct inside the container.

services:
  - type: web
    name: warli-backend
    runtime: docker
    plan: free                 # upgrade for persistent disk + more RAM (faster ASR)
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ASR (Whisper). The 'tiny' model is pre-downloaded INTO the image at build
      # time (see Dockerfile) so cold starts don't re-fetch it — the main fix for
      # the "slow server" symptom. Render FREE tier = 512 MB RAM, so keep 'tiny';
      # upgrade the instance to use 'base'/'small' for better accuracy. Set
      # WARLI_ASR_ENABLED=false to run text+TTS only (no model, less RAM).
      - key: WARLI_ASR_ENABLED
        value: "true"
      - key: WARLI_ASR_MODEL
        value: tiny
      - key: WARLI_ASR_DEVICE
        value: cpu
      - key: WARLI_ASR_COMPUTE
        value: int8

      # Translation engine (rule-based for now).
      - key: WARLI_TRANSLATION_ENGINE
        value: rule

      # TTS — APPROXIMATION (voice reading Warli Devanagari). gTTS needs outbound
      # internet; Render provides it. Warli is a Marathi-family language, so the
      # Marathi voice ('mr') pronounces it better than Hindi ('hi').
      - key: WARLI_TTS_ENABLED
        value: "true"
      - key: WARLI_TTS_LANG
        value: mr

      # Optional pronunciation layer (decoupled).
      - key: WARLI_PRONUNCIATION_ENABLED
        value: "true"

      # Same-origin now, so the served app needs no CORS. These origins are only
      # for a local/preview frontend pointed at the deployed API.
      - key: WARLI_CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173

      # Model cache location inside the image (baked at build time).
      - key: HF_HOME
        value: /app/.cache/huggingface
